<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button class="btn theme-toggle" id="theme-toggle" title="Alternar tema">🌙</button>

  <main class="container">
    <h1 class="app-title">Tasks</h1>

    <form class="task-form" id="task-form">
      <input
        class="task-input"
        id="task-input"
        type="text"
        placeholder="Task title..."
        required
      />
      <textarea
        class="task-textarea"
        id="task-description"
        placeholder="Description (optional)"
        rows="2"
      ></textarea>
      <div class="form-bottom">
        <select class="priority-select" id="priority-select">
          <option value="medium">Média</option>
          <option value="high">Alta</option>
          <option value="low">Baixa</option>
        </select>
        <button class="btn btn-primary" type="submit">Adicionar</button>
      </div>
    </form>

    <!-- Resumo e filtros -->
    <div class="summary" id="summary">
      <span id="summary-text"></span>
      <div class="filters">
        <button class="btn btn-filter active" data-filter="all">Todas</button>
        <button class="btn btn-filter" data-filter="pending">Pendentes</button>
        <button class="btn btn-filter" data-filter="completed">Concluídas</button>
      </div>
    </div>

    <!-- Barra de progresso -->
    <div class="progress-container" id="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <p class="empty-state" id="empty-state">Nenhuma tarefa ainda. Adicione uma acima!</p>
  </main>

  <!-- Modal de detalhes -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-description" id="modal-description"></p>
      <div class="modal-meta">
        <span class="priority-badge" id="modal-priority"></span>
        <span class="modal-date" id="modal-date"></span>
      </div>
      <div class="modal-status" id="modal-status"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
