<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button class="btn theme-toggle" id="theme-toggle" title="Alternar tema">🌙</button>

  <main class="container">
    <h1 class="app-title">Tasks</h1>

    <form class="task-form" id="task-form">
      <input
        class="task-input"
        id="task-input"
        type="text"
        placeholder="Nova tarefa..."
        required
      />
      <select class="priority-select" id="priority-select">
        <option value="medium">Média</option>
        <option value="high">Alta</option>
        <option value="low">Baixa</option>
      </select>
      <button class="btn btn-primary" type="submit">Adicionar</button>
    </form>

    <!-- Resumo e filtros -->
    <div class="summary" id="summary">
      <span id="summary-text"></span>
      <div class="filters">
        <button class="btn btn-filter active" data-filter="all">Todas</button>
        <button class="btn btn-filter" data-filter="pending">Pendentes</button>
        <button class="btn btn-filter" data-filter="completed">Concluídas</button>
      </div>
    </div>

    <!-- Barra de progresso -->
    <div class="progress-container" id="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <ul class="task-list" id="task-list"></ul>

    <p class="empty-state" id="empty-state">Nenhuma tarefa ainda. Adicione uma acima!</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
